# Smithery configuration file: https://smithery.ai/docs/config#smitheryyaml

startCommand:
  type: streamable-http
  configSchema:
    # JSON Schema defining the configuration options for the MCP (Streamable HTTP).
    type: object
    required:
      - connectionString
    properties:
      connectionString:
        type: string
        description: PostgreSQL connection string, e.g.,
          postgresql://username:password@host:port/database
      host:
        type: string
        description: Host to bind for HTTP transport (default 127.0.0.1)
        default: 127.0.0.1
      port:
        type: integer
        description: Port to bind for HTTP transport (default 8000)
        default: 8000
  commandFunction:
    # A JS function that produces the CLI command based on the given config to start the MCP over Streamable HTTP.
    |-
    (config) => ({
      command: 'python',
      args: [
        'postgres_server.py',
        '--transport', 'streamable-http',
        '--host', config.host || '127.0.0.1',
        '--port', String(config.port || 8000),
        '--conn', config.connectionString,
      ],
    })
  exampleConfig:
    connectionString: postgresql://user:pass@localhost:5432/mydatabase
    host: 127.0.0.1
    port: 8000
