startCommand:
  type: streamable-http
  configSchema:
    type: object
    required:
      - connectionString
    properties:
      connectionString:
        type: string
        description: PostgreSQL connection string
      host:
        type: string
        default: 127.0.0.1
      port:
        type: integer
        default: 8000
  commandFunction: |-
    (config) => ({
      command: 'python',
      args: [
        'postgres_server.py',
        '--transport', 'streamable-http',
        '--host', config.host || '127.0.0.1',
        '--port', String(config.port || 8000),
        '--conn', config.connectionString,
      ],
    })
  exampleConfig:
    connectionString: postgresql://user:pass@localhost:5432/mydatabase
    host: 127.0.0.1
    port: 8000
